# /etc/ssh/sshd_config.d/99-hardening.conf
# Key-only SSH for the PassVault server. Apply after your public key is
# verified working (RUNBOOK §0/§3): a typo here can lock you out.
#
#   sudo cp 99-hardening.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t                      # validate before reloading!
#   sudo systemctl reload ssh

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3

# Optional: pin which users may SSH in (uncomment + edit).
#AllowUsers ubuntu
