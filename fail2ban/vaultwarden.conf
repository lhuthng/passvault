# /etc/fail2ban/filter.d/vaultwarden.conf
# Matches failed login lines from Vaultwarden's LOG_FILE (LOG_LEVEL=warn).
# Verify against your real log with:
#   fail2ban-regex /opt/passvault/data/vw.log /etc/fail2ban/filter.d/vaultwarden.conf
[Definition]
failregex = ^.*\[.*\]\[.*\]\[.*\]\[.*\]\s+Username or password is incorrect\. Try again\. IP: <HOST>\..*$
            ^.*\[.*\]\[.*\]\[.*\]\[.*\]\s+Invalid TOTP code!? .*(?:IP: |for user\. IP: )<HOST>\..*$
            ^.*\[.*\]\[.*\]\[.*\]\[.*\]\s+Invalid or expired WebAuthn registration.*IP: <HOST>\..*$
journalmatch =
